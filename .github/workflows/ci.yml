name: Quality checks

on:
  pull_request:
  push:
    branches: [main, codex/platform-hardening]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: npm --prefix site ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm --prefix site test
      - run: npm --prefix site run build:next
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q services bridge-bot-integration
      - run: ruff check bridge-bot-integration services/drox-bot/tests/test_zuros_client.py services/drox-bot/tests/test_perms.py
      - run: black --check bridge-bot-integration services/drox-bot/tests/test_zuros_client.py services/drox-bot/tests/test_perms.py
      - run: npm audit --omit=dev
      - run: npm --prefix site audit --omit=dev
